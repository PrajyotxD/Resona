<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .container {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }
        
        .card {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 24px;
            padding: 60px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .album-art {
            width: 640px;
            height: 640px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 48px;
            background: #333;
        }
        
        .title {
            font-size: 56px;
            font-weight: bold;
            color: #FFFFFF;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.2;
            max-width: 900px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .artist {
            font-size: 36px;
            font-weight: 500;
            color: #CCCCCC;
            text-align: center;
            margin-bottom: 8px;
            max-width: 900px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .metadata {
            font-size: 28px;
            font-weight: 300;
            color: #AAAAAA;
            text-align: center;
        }
        
        .watermark {
            position: absolute;
            bottom: 24px;
            left: 24px;
            font-size: 24px;
            font-weight: bold;
            color: #FFFFFF;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container" id="gradient-container">
        <div class="card">
            <img class="album-art" id="album-art" src="{{ALBUM_ART}}" alt="Album Art">
            <div class="title" id="title">{{TITLE}}</div>
            <div class="artist" id="artist">{{ARTIST}}</div>
            <div class="metadata" id="metadata">{{METADATA}}</div>
            <div class="watermark">Resona</div>
        </div>
    </div>
</body>
</html>
