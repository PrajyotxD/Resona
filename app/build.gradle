plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'music.resona'
    compileSdk 36

    defaultConfig {
        applicationId "music.resona"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Dynamic colors for Material You
    implementation libs.core.splashscreen

    // Palette for color extraction
    implementation libs.palette

    implementation libs.sdp.android
    implementation libs.legacy.support.v4
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.ui.graphics

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.room.runtime
    implementation libs.okhttp
    implementation libs.gson
    implementation libs.work.runtime
    implementation libs.activity
    implementation libs.glide
    implementation libs.swiperefreshlayout
    implementation libs.coordinatorlayout

    annotationProcessor libs.room.compiler
    annotationProcessor libs.glide.compiler
    implementation libs.ssp.android
    // App depends on bridge module only (not directly on innertube)
    implementation project(':innertube-bridge')
    implementation project(':obscura')

    implementation files('libs/Blur3-release.aar','libs/NavigationBar-release.aar')
}